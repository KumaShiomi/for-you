<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One month with you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #FCE7E4;
    --paper: #FFF8F5;
    --wine: #43142B;
    --rose: #D9455F;
    --sun: #F4B860;
    --serif-display: "Instrument Serif", Georgia, serif;
    --serif-body: "Newsreader", Georgia, serif;
    --sans: "DM Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--blush);
    color: var(--wine);
    font-family: var(--serif-body);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 88vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8vh 6vw 4vh;
    max-width: 1100px;
    margin: 0 auto;
  }
  .hero h1 {
    font-family: var(--serif-display);
    font-weight: 400;
    font-size: clamp(3.6rem, 14vw, 10rem);
    line-height: 0.92;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .hero .for {
    font-family: var(--sans);
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    margin: 2rem 0 0;
    max-width: 34ch;
    line-height: 1.5;
  }

  /* ---------- Letter ---------- */
  .letter-wrap { padding: 4vh 5vw 12vh; }
  .letter {
    background: var(--paper);
    max-width: 680px;
    margin: 0 auto;
    padding: clamp(1.8rem, 6vw, 4rem);
    border-radius: 4px;
    box-shadow: 0 1px 0 rgba(67,20,43,.08), 0 24px 50px -28px rgba(67,20,43,.45);
    transform: rotate(-.6deg);
  }
  .letter h2 {
    font-family: var(--serif-display);
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    margin: 0 0 1.5rem;
    line-height: 1.1;
  }
  .letter p {
    font-size: clamp(1.1rem, 2.6vw, 1.3rem);
    line-height: 1.75;
    margin: 0 0 1.2em;
  }
  .letter .sign {
    margin: 2rem 0 0;
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 1.8rem;
    line-height: 1.2;
  }

  /* ---------- Running gallery ---------- */
  .gallery { padding: 4vh 0 14vh; overflow: hidden; }
  .gallery h2 {
    font-family: var(--serif-display);
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem);
    margin: 0 6vw 2.5rem;
    max-width: 1100px;
    line-height: 1.1;
  }
  .row { overflow: hidden; padding: 1.2rem 0; }
  .track {
    display: flex;
    gap: 1.5rem;
    width: max-content;
    animation: run 60s linear infinite;
  }
  .row.reverse .track { animation-direction: reverse; animation-duration: 75s; }
  .row:hover .track, .row:focus-within .track { animation-play-state: paused; }
  @keyframes run {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .card {
    all: unset;
    cursor: pointer;
    flex: none;
    width: clamp(170px, 42vw, 250px);
    background: #fff;
    padding: .7rem;
    border-radius: 3px;
    box-shadow: 0 14px 28px -16px rgba(67,20,43,.5);
    transition: transform .2s ease;
  }
  .card:nth-child(4n+1) { transform: rotate(-2.5deg); }
  .card:nth-child(4n+2) { transform: rotate(1.8deg) translateY(10px); }
  .card:nth-child(4n+3) { transform: rotate(-1deg); }
  .card:nth-child(4n)   { transform: rotate(2.6deg) translateY(6px); }
  .card:hover { transform: rotate(0) scale(1.05); z-index: 2; }
  .card:focus-visible { outline: 3px solid var(--rose); outline-offset: 4px; }
  .card .ph {
    aspect-ratio: 4 / 5;
    width: 100%;
    background: linear-gradient(135deg, var(--sun), var(--rose));
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 2.4rem;
    overflow: hidden;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card figcaption, .card .cap {
    display: block;
    padding: .7rem .2rem .1rem;
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.2;
    text-align: center;
  }

  /* ---------- Lightbox ---------- */
  dialog {
    border: 0;
    padding: .9rem;
    background: #fff;
    border-radius: 4px;
    max-width: min(94vw, 760px);
    color: var(--wine);
    overflow: visible;
  }
  dialog[open] { animation: zoomIn .35s cubic-bezier(.2, .8, .2, 1); }
  dialog[open]::backdrop { animation: fadeIn .35s ease-out; }
  @keyframes zoomIn {
    from { opacity: 0; transform: scale(.55) rotate(-3deg); }
    to   { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  dialog::backdrop { background: rgba(67,20,43,.75); }
  dialog img { width: 100%; max-height: 82vh; object-fit: contain; display: block; }
  dialog .cap {
    font-family: var(--serif-display);
    font-style: italic;
    font-size: 1.4rem;
    text-align: center;
    padding: .8rem 0 1rem;
  }
  dialog button {
    position: absolute; top: .5rem; right: .5rem;
    width: 2.4rem; height: 2.4rem;
    border-radius: 50%; border: 0;
    background: var(--wine); color: #fff;
    font-size: 1.2rem; cursor: pointer;
  }

  footer {
    text-align: center;
    font-family: var(--sans);
    font-size: .9rem;
    padding: 0 1rem 6vh;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .track { animation: none; }
    .row { overflow-x: auto; }
    dialog[open], dialog[open]::backdrop { animation: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <h1 id="title">One month with you</h1>
  <p class="for" id="forLine"></p>
</header>

<main>
  <section class="letter-wrap" id="letter">
    <article class="letter">
      <h2 id="letterHeading"></h2>
      <div id="letterBody"></div>
      <p class="sign" id="sign"></p>
    </article>
  </section>

  <section class="gallery" aria-labelledby="galleryHeading">
    <h2 id="galleryHeading">You and Me</h2>
    <div class="row" id="row1"><div class="track"></div></div>
    <div class="row reverse" id="row2"><div class="track"></div></div>
  </section>
</main>

<footer id="footer"></footer>

<dialog id="lightbox">
  <button type="button" id="closeBtn" aria-label="Close photo">×</button>
  <img id="lbImg" alt="">
  <div class="cap" id="lbCap"></div>
</dialog>

<script>
/*===================================================== */
const CONFIG = {
  pageTitle: "One month with you",
  to: "My love",                 // her/his name or nickname
  from: "Kuma",             // your name
  heroLine: "Just a little note to say how much I love you and how happy I am to be with you.",

  letterHeading: "Thank you for being here with me.",
  message: [
    "I have never been a guy who is good at expressing his feelings, but I want to try to do it for you. I want to tell you how much I love you and how happy I am to be with you.",
    "They said that love is both a feeling and a choice, and I choose to love you every day. I choose to be with you, to support you, and to make you happy. I want to be the best version of myself for you, and I hope that I can make you feel loved and cherished.",
    "I don't know what the future holds for us, but I know that I want to spend it with you. I want to create memories, share experiences, and build a life together. I want to be there for you through the ups and downs, and through the good and the ugly. I want to be your partner, your friend, and your lover.",
  ],
  signOff: "With all my love, Kuma",

  /* Gallery */
  photos: [
    { src: "images/for you (1).jpg" },
    { src: "images/for you (1).png" },
    { src: "images/for you (2).jpg" },
    { src: "images/for you (2).png" },
    { src: "images/for you (3).jpg" },
    { src: "images/for you (3).png" },
    { src: "images/for you (4).jpg" },
    { src: "images/for you (4).png" },
    { src: "images/for you (5).jpg" },
    { src: "images/for you (6).jpg" },
    { src: "images/for you (7).jpg" },
    { src: "images/for you (8).jpg" },
    { src: "images/for you (9).jpg" },
    { src: "images/for you (10).jpg" },
    { src: "images/for you (11).jpg" },
    { src: "images/for you (12).jpg" },
    { src: "images/for you (13).jpg" },
    { src: "images/for you (14).jpg" },
    { src: "images/for you (15).jpg" },
    { src: "images/for you (16).JPG" },
    { src: "images/for you (17).JPG" },
    { src: "images/for you (18).jpg" },
    { src: "images/for you (19).jpg" },
  ],

  footer: "Made with love, for you.",
};
/* ===================================================== */

const $ = (id) => document.getElementById(id);

document.title = CONFIG.pageTitle;
$("forLine").textContent = `For ${CONFIG.to}. ${CONFIG.heroLine}`;
$("letterHeading").textContent = CONFIG.letterHeading;
$("sign").textContent = CONFIG.signOff;
$("footer").textContent = CONFIG.footer;

/* Message paragraphs (textContent keeps it safe) */
CONFIG.message.forEach((text) => {
  const p = document.createElement("p");
  p.textContent = text;
  $("letterBody").appendChild(p);
});

/* Running gallery */
const lightbox = $("lightbox");

function openLightbox(photo, label, broken) {
  const lbImg = $("lbImg");
  const lbCap = $("lbCap");
  if (broken) {
    // Photo file was not found: say so instead of doing nothing
    lbImg.style.display = "none";
    lbCap.textContent = `Photo not found: ${photo.src}. Check the file name and that it is inside the images folder.`;
    lbCap.hidden = false;
  } else {
    lbImg.style.display = "block";
    lbImg.src = photo.src;
    lbImg.alt = label;
    lbCap.textContent = photo.caption || "";
    lbCap.hidden = !photo.caption;
  }
  if (typeof lightbox.showModal === "function") lightbox.showModal();
  else lightbox.setAttribute("open", "");   // very old browsers
}

function makeCard(photo) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "card";
  const label = photo.caption || "Our photo";
  card.setAttribute("aria-label", `Open photo: ${label}`);

  const ph = document.createElement("span");
  ph.className = "ph";

  const img = document.createElement("img");
  img.alt = label;
  img.decoding = "async";
  img.addEventListener("error", () => {
    img.remove();
    ph.textContent = "♥";
    card.dataset.broken = "1";
  });
  img.src = photo.src;
  ph.append(img);
  card.append(ph);

  if (photo.caption) {            // captions only show if you add one
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = photo.caption;
    card.append(cap);
  }

  card.addEventListener("click", () => openLightbox(photo, label, !!card.dataset.broken));
  return card;
}

function fillRow(rowId, photos) {
  let set = photos.slice();
  while (set.length < 8) set = set.concat(photos); // keep the row wide enough
  const track = document.querySelector(`#${rowId} .track`);
  // Two identical halves so the loop is seamless
  [...set, ...set].forEach((p, i) => {
    const c = makeCard(p);
    if (i >= set.length) c.setAttribute("aria-hidden", "true"), c.tabIndex = -1;
    track.appendChild(c);
  });
}

const photos = CONFIG.photos;
fillRow("row1", photos);
fillRow("row2", photos.slice().reverse());

$("closeBtn").addEventListener("click", () => lightbox.close());
lightbox.addEventListener("click", (e) => { if (e.target === lightbox) lightbox.close(); });
</script>
</body>
</html>
